name: Validar Backup Verificado 0.2
'on':
  push:
    branches:
    - validation/pending-initial-cores
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .validation/projects/backup-verificado
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Formatar, analisar e testar Rust
      run: docker run --rm -v "$PWD:/work" -w /work rust:1.85-bookworm sh -c "rustup component add rustfmt clippy && cargo fmt && cargo clippy
        --all-targets -- -D warnings && cargo test --all-targets"
    - name: Registrar lockfile e fonte formatada
      if: always()
      run: 'python3 - <<''PY_OUT''

        from pathlib import Path

        import json

        print(json.dumps({''backup_generated'': {''cargo_lock'':Path(''Cargo.lock'').read_text() if Path(''Cargo.lock'').exists() else None,''sources'':{str(p):p.read_text()
        for folder in [''src'',''tests''] for p in Path(folder).glob(''*.rs'')}}}))

        PY_OUT'
