[package]
name = "backup-verificado"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Snapshots locais com deduplicação, BLAKE3 e restauração sem sobrescrita"

[dependencies]
blake3 = "=1.5.5"
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
tempfile = "=3.16.0"
